name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy (non-strict)
        run: mypy src/tracetopolicy || true
      - name: Unit tests (fast, offline)
        run: pytest -m "not slow" --cov=tracetopolicy --cov-report=term-missing

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Smoke pipeline (warehouse -> harvest -> label -> eval dry-run)
        run: python scripts/smoke.py
